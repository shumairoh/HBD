<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selamat Ulang Tahun 🎉</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(135deg, #1d2671, #c33764);
      overflow: hidden;
    }
    .card {
      background: rgba(255,255,255,0.95);
      padding: 40px 30px;
      border-radius: 24px;
      text-align: center;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 25px 50px rgba(0,0,0,.25);
      animation: pop 0.9s ease;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 2.4rem;
      color: #c33764;
    }
    h2 {
      margin: 0 0 20px;
      font-weight: 500;
      color: #333;
    }
    p {
      color: #555;
      line-height: 1.7;
      margin-bottom: 30px;
    }
    button {
      border: none;
      padding: 14px 30px;
      border-radius: 40px;
      background: linear-gradient(135deg, #1d2671, #c33764);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(0,0,0,.3);
    }

    /* Confetti */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -10px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); }
    }
    @keyframes pop {
      0% { transform: scale(.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <audio id="music" src="song brithday.mp3"></audio>

  <div class="card">
    <h1 style="animation: floatText 1s ease forwards;">🎂 Happy Birthday!</h1>
    <h2 id="nameText" style="animation: floatText 1.3s ease forwards;">🎉</h2>
    <p id="ageText" style="animation: floatText 1.6s ease forwards;"></p>
    
    <p>
      Di hari yang penuh kebahagiaan ini, semoga semua doa baik menjadi nyata.
      Semoga hidupmu selalu dipenuhi senyum, cinta, dan kesuksesan. <br>
      Semangat terus belajar dan menghafalnya!
    </p>
    <button onclick="celebrate()">Rayakan Sekarang 🎉</button>
  </div>
  <script>
function celebrate() {
const name = prompt('masukkan nama');
const age = prompt('Masukkan umur:');


if (name) {
document.getElementById('nameText').innerText = 'Untuk ' + name;
}
if (age) {
document.getElementById('ageText').innerText = '🎈 Selamat ulang tahun yang ke-' + age + ' 🎈';
}


document.getElementById('music').play();
for (let i = 0; i < 100; i++) {
const confetti = document.createElement('div');
confetti.classList.add('confetti');
const size = Math.random() * 8 + 6;
confetti.style.width = size + 'px';
confetti.style.height = size + 'px';
confetti.style.left = Math.random() * 100 + 'vw';
confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 60%)`;
confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
document.body.appendChild(confetti);
setTimeout(() => confetti.remove(), 5000);
}
} 100% 60%
confetti.style.animationDuration  .random() * 3 + 2 + 's';
document.body.appendChild(confetti);
setTimeout(() => confetti.remove(), 5000);


</script>


  </script>
</body>
</html>
